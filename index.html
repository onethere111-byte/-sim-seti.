<!DOCTYPE html> <html lang="ru"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Симулятор сотовой сети</title> <style> :root { --bg-dark: #0f172a; --panel-bg: #1e293b; --border-color: #334155; --text-main: #f8fafc; --text-muted: #94a3b8; --accent: #38bdf8; --accent-hover: #0284c7; --success: #22c55e; --warning: #f59e0b; --danger: #ef4444; }

* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; } body { background-color: var(--bg-dark); color: var(--text-main); display: flex; flex-direction: column; min-height: 100vh; overflow-x: hidden; } header { background-color: var(--panel-bg); padding: 1rem 1.5rem; border-bottom: 1px solid var(--border-color);

display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; } header h1 { font-size: 1.25rem; display: flex; align-items: center; gap: 0.5rem; color: var(--accent); } .stats-bar { display: flex; gap: 1.5rem; font-size: 0.9rem; flex-wrap: wrap;

} .stat-item span { font-weight: bold; color: var(--accent); } .main-container { display: flex; flex: 1; flex-direction: row; height: calc(100vh - 65px); } @media (max-width: 900px) { .main-container { flex-direction: column; height: auto; } }

.canvas-wrapper { flex: 1; position: relative; background: radial-gradient(circle at center, #162238 0%, #0b1120 100%); min-height: 450px; overflow: hidden; touch-action: none; } canvas { display: block; width: 100%; height: 100%; cursor: crosshair; } .canvas-hint { position: absolute; bottom: 12px;

left: 12px; background: rgba(15, 23, 42, 0.85); padding: 8px 12px; border-radius: 8px; font-size: 0.8rem; color: var(--text-muted); border: 1px solid var(--border-color); pointer-events: none; } .sidebar { width: 360px; background-color: var(--panel-bg); border-left: 1px solid var(--border-color); display: flex; flex-direction: column; overflow-y: auto; } @media (max-width: 900px) {

.sidebar { width: 100%; border-left: none; border-top: 1px solid var(--border-color); } } .panel-section { padding: 1.2rem; border-bottom: 1px solid var(--border-color); } .panel-section h2 { font-size: 0.95rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: 0.9rem; }

.btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; } button { background-color: #293548; color: var(--text-main); border: 1px solid var(--border-color); padding: 0.6rem 0.8rem; border-radius: 6px; font-size: 0.85rem; font-weight: 500; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 0.4rem;

} button:hover:not(:disabled) { background-color: #38465e; border-color: var(--accent); } button.active { background-color: var(--accent); color: #0f172a; border-color: var(--accent); font-weight: 600; } button.btn-call { background-color: var(--success); color: #052e16; border-color: var(--success); font-weight: 600; }

button.btn-call:hover:not(:disabled) { background-color: #16a34a; } button.btn-end { background-color: var(--danger); color: white; border-color: var(--danger); } button.btn-end:hover:not(:disabled) { background-color: #dc2626; } button:disabled { opacity: 0.5; cursor: not-allowed; }

.control-row { margin-bottom: 0.8rem; } .control-row label { display: block; font-size: 0.82rem; color: var(--text-muted); margin-bottom: 0.35rem; } select, input[type="range"] { width: 100%; background-color: var(--bg-dark); color: var(--text-main); border: 1px solid var(--border-color); padding: 0.5rem; border-radius: 6px; font-size: 0.85rem; }

.phone-card { background-color: var(--bg-dark); border: 1px solid var(--border-color); border-radius: 8px; padding: 0.85rem; margin-bottom: 0.7rem; } .phone-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; } .phone-title { font-weight: 600; font-size: 0.95rem; display: flex;

align-items: center; gap: 0.4rem; } .signal-bars { display: flex; align-items: flex-end; gap: 2px; height: 14px; } .bar { width: 3px; background-color: #334155; border-radius: 1px; } .bar.active { background-color: var(--success); }

.phone-details { font-size: 0.8rem; color: var(--text-muted); display: grid; grid-template-columns: 1fr 1fr; gap: 0.3rem; } .log-box { background-color: #090e1a; border: 1px solid var(--border-color); border-radius: 6px; padding: 0.7rem; height: 160px; overflow-y: auto; font-family: 'Consolas', monospace; font-size: 0.78rem; display: flex; flex-direction: column;

gap: 0.35rem; } .log-entry { line-height: 1.3; } .log-time { color: #64748b; } .log-info { color: #38bdf8; } .log-success { color: #4ade80; } .log-warn { color: #fbbf24; } .log-error { color: #f87171; } /* Всплывающее уведомление вместо alert */ #toast { position: fixed; top: 80px;

left: 50%; transform: translateX(-50%); background-color: var(--panel-bg); border: 1px solid var(--accent); color: var(--text-main); padding: 10px 20px; border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); z-index: 1000; font-size: 0.9rem; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; } #toast.show { opacity: 1; } </style> </head>

<body> <header> <h1>📡 Симулятор сотовой сети (BTS / GSM / LTE / 5G)</h1> <div class="stats-bar"> <div class="stat-item">Вышек: <span id="stat-towers">0</span></div> <div class="stat-item">Абонентов: <span id="stat-phones">0</span></div> <div class="stat-item">Активных звонков: <span id="stat-calls">0</span></div> </div> </header> <div id="toast">Уведомление</div> <div class="main-container"> <div class="canvas-wrapper" id="canvas-container"> <canvas id="networkCanvas"></canvas> <div class="canvas-hint"> 🖱️ <b>Перетаскивайте</b> абонентов или вышки • <b>Кликните</b> на пустое место в режиме добавления </div> </div>

<aside class="sidebar"> <!-- Инструменты --> <div class="panel-section"> <h2>Инструменты карты</h2> <div class="btn-group"> <button id="mode-move" class="active" onclick="setMode('move')">✋ Перемещение</button> <button id="mode-tower" onclick="setMode('tower')">🗼 + Вышка</button> <button id="mode-phone" onclick="setMode('phone')">📱 + Абонент</button> <button onclick="resetSimulation()">🔄 Сброс сети</button> </div> <div class="control-row" style="margin-top: 0.9rem;"> <label>Радиус покрытия новой вышки: <span id="radius-val">180</span> м</label> <input type="range" id="tower-radius" min="100" max="300" value="180" oninput="document.getElementById('radius-val').textContent = this.value"> </div> </div> <!-- Управление звонками --> <div class="panel-section"> <h2>Коммутация звонка</h2>

<div class="control-row"> <label>От кого (Вызывающий):</label> <select id="caller-select"></select> </div> <div class="control-row"> <label>Кому (Вызываемый):</label> <select id="callee-select"></select> </div> <div class="btn-group"> <button class="btn-call" id="btn-start-call" onclick="initiateCall()">📞 Позвонить</button> <button class="btn-end" id="btn-end-call" onclick="endAllCalls()">📵 Сбросить все</button> </div> </div> <!-- Список абонентов --> <div class="panel-section"> <h2>Абоненты в сети</h2> <div id="phones-list"></div> </div>

<!-- Лог работы ядра сети --> <div class="panel-section" style="border-bottom: none;"> <h2>Журнал ядра сети (Core Network)</h2> <div class="log-box" id="network-log"></div> </div> </aside> </div> <script> /** * Архитектура симулятора сотовой связи: * 1. CellTower (Базовая станция - BTS/eNodeB): имеет координаты, радиус действия, поколение (4G/5G) и список подключенных абонентов. * 2. MobileSubscriber (Абонент - UE): имеет номер, баланс, координаты, текущую вышку (Handover при перемещении) и статус звонка. * 3. ActiveCall (Сессия звонка): связывает двух абонентов через их базовые станции, списывает средства по тарифу и обрывается при потере сигнала. */ const canvas = document.getElementById('networkCanvas'); const ctx = canvas.getContext('2d'); const container = document.getElementById('canvas-container');

let towers = []; let phones = []; let activeCalls = []; let currentMode = 'move'; // 'move', 'tower', 'phone' let draggedEntity = null; let dragOffset = { x: 0, y: 0 }; let pulsePhase = 0; const TARIFF_PER_SEC = 1.5; // 1.5 руб/сек class CellTower { constructor(id, x, y, radius = 180, tech = '5G') { this.id = id; this.name = `BTS-${id}`; this.x = x; this.y = y; this.radius = radius; this.tech = tech; } }

class MobileSubscriber { constructor(id, number, x, y, balance = 100) { this.id = id; this.number = number; this.x = x; this.y = y; this.balance = balance; this.connectedTower = null; this.signalStrength = 0; // 0 - 100% this.inCallWith = null; } } // Вывод системных уведомлений без использования alert() function showToast(msg) { const toast = document.getElementById('toast'); toast.textContent = msg; toast.classList.add('show'); clearTimeout(toast.timer);

toast.timer = setTimeout(() => toast.classList.remove('show'), 3000); } // Запись событий в журнал ядра сети (HLR/VLR/MSC) function logEvent(message, type = 'info') { const logBox = document.getElementById('network-log'); const now = new Date().toLocaleTimeString('ru-RU'); const entry = document.createElement('div'); entry.className = `log-entry log-${type}`; entry.innerHTML = `<span class="log-time">[${now}]</span> ${message}`; logBox.appendChild(entry); logBox.scrollTop = logBox.scrollHeight; } // Адаптивный размер Canvas function resizeCanvas() { canvas.width = container.clientWidth; canvas.height = container.clientHeight; draw(); }

window.addEventListener('resize', resizeCanvas); // Инициализация стартового сценария function initSimulation() { towers = []; phones = []; activeCalls = []; document.getElementById('network-log').innerHTML = ''; const w = container.clientWidth || 800; const h = container.clientHeight || 500; towers.push(new CellTower(1, w * 0.3, h * 0.45, 200, '5G')); towers.push(new CellTower(2, w * 0.7, h * 0.55, 190, '4G LTE')); phones.push(new MobileSubscriber(1, '+7 (999) 111-22-33', w * 0.25, h * 0.4, 150)); phones.push(new MobileSubscriber(2, '+7 (999) 444-55-66', w * 0.72, h * 0.5, 80)); phones.push(new MobileSubscriber(3, '+7 (999) 777-88-99', w * 0.5, h * 0.2, 25));

logEvent('Ядро сотовой сети инициализировано (MSC/HLR активны).', 'success'); updateNetworkState(); updateSelectors(); } function resetSimulation() { initSimulation(); showToast('Симуляция сброшена к начальным настройкам'); } function setMode(mode) { currentMode = mode; document.querySelectorAll('.sidebar button').forEach(b => b.classList.remove('active')); const activeBtn = document.getElementById(`mode-${mode}`); if (activeBtn) activeBtn.classList.add('active'); canvas.style.cursor = mode === 'move' ? 'grab' : 'crosshair'; } // Расчет расстояния между точками function getDistance(a, b) {

return Math.hypot(a.x - b.x, a.y - b.y); } // Обновление подключений абонентов (Регистрация и Хэндовер) function updateNetworkState() { phones.forEach(phone => { let bestTower = null; let bestSignal = 0; towers.forEach(tower => { const dist = getDistance(phone, tower); if (dist <= tower.radius) { // Уровень сигнала убывает от центра к краю соты const strength = Math.round((1 - dist / tower.radius) * 100); if (strength > bestSignal) { bestSignal = strength; bestTower = tower; } } });

// Проверка на смену вышки (Handover) или потерю сети if (phone.connectedTower !== bestTower) { if (phone.connectedTower && bestTower) { logEvent(`Handover: ${phone.number} переключен с ${phone.connectedTower.name} на ${bestTower.name}`, 'info'); } else if (!phone.connectedTower && bestTower) { logEvent(`Регистрация: ${phone.number} подключился к ${bestTower.name} (${bestTower.tech})`, 'success'); } else if (phone.connectedTower && !bestTower) { logEvent(`Потеря сети: ${phone.number} вышел из зоны покрытия!`, 'error'); } } phone.connectedTower = bestTower; phone.signalStrength = bestSignal; }); // Проверка активных звонков на обрыв связи for (let i = activeCalls.length - 1; i >= 0; i--) { const call = activeCalls[i]; if (!call.caller.connectedTower || !call.callee.connectedTower) {

logEvent(`Обрыв звонка: ${call.caller.number} ↔ ${call.callee.number} (нет сигнала)`, 'error'); showToast('Звонок оборвался: абонент вне зоны действия сети!'); terminateCall(i); } } renderUI(); } // Инициация голосового вызова function initiateCall() { const callerId = parseInt(document.getElementById('caller-select').value); const calleeId = parseInt(document.getElementById('callee-select').value); if (callerId === calleeId) { showToast('Нельзя позвонить самому себе'); return; } const caller = phones.find(p => p.id === callerId);

const callee = phones.find(p => p.id === calleeId); if (!caller || !callee) return; if (caller.inCallWith || callee.inCallWith) { showToast('Один из абонентов уже разговаривает (Линия занята)'); logEvent(`Отказ вызова: линия занята`, 'warn'); return; } if (!caller.connectedTower) { showToast(`У вызывающего (${caller.number}) нет сети`); logEvent(`Ошибка вызова: ${caller.number} вне зоны сети`, 'error'); return; } if (!callee.connectedTower) { showToast(`Абонент ${callee.number} недоступен`); logEvent(`Ошибка вызова: ${callee.number} вне зоны сети`, 'error'); return;

} if (caller.balance < TARIFF_PER_SEC) { showToast(`Недостаточно средств на счете ${caller.number}`); logEvent(`Биллинг: отказ для ${caller.number} (баланс ${caller.balance.toFixed(1)} ₽)`, 'error'); return; } caller.inCallWith = callee; callee.inCallWith = caller; activeCalls.push({ caller, callee, duration: 0 }); logEvent(`Соединение: ${caller.number} (${caller.connectedTower.name}) → ${callee.number} (${callee.connectedTower.name})`, 'success'); updateNetworkState(); }

function terminateCall(index) { const call = activeCalls[index]; if (call) { call.caller.inCallWith = null; call.callee.inCallWith = null; activeCalls.splice(index, 1); updateNetworkState(); } } function endAllCalls() { if (activeCalls.length === 0) return; while (activeCalls.length > 0) { const call = activeCalls[0]; logEvent(`Завершение вызова: ${call.caller.number} ↔ ${call.callee.number} (${call.duration} сек.)`, 'info'); terminateCall(0); } showToast('Все вызовы завершены'); }

// Биллинг и таймер звонков (каждую секунду) setInterval(() => { if (activeCalls.length === 0) return; for (let i = activeCalls.length - 1; i >= 0; i--) { const call = activeCalls[i]; call.duration += 1; call.caller.balance -= TARIFF_PER_SEC; if (call.caller.balance <= 0) { call.caller.balance = 0; logEvent(`Биллинг: звонок ${call.caller.number} прерван (исчерпан баланс)`, 'warn'); showToast(`Закончились средства у ${call.caller.number}`); terminateCall(i); } } renderUI(); }, 1000);

// Пополнение баланса function topUpBalance(phoneId) { const phone = phones.find(p => p.id === phoneId); if (phone) { phone.balance += 50; logEvent(`Биллинг: пополнение ${phone.number} на +50 ₽`, 'success'); renderUI(); } } // Обновление выпадающих списков function updateSelectors() { const callerSel = document.getElementById('caller-select'); const calleeSel = document.getElementById('callee-select'); const prevCaller = callerSel.value; const prevCallee = calleeSel.value; callerSel.innerHTML = ''; calleeSel.innerHTML = '';

phones.forEach((p, idx) => { const opt1 = new Option(`${p.number} (${p.balance.toFixed(0)} ₽)`, p.id); const opt2 = new Option(`${p.number}`, p.id); callerSel.add(opt1); calleeSel.add(opt2); }); if (prevCaller && phones.some(p => p.id == prevCaller)) callerSel.value = prevCaller; if (prevCallee && phones.some(p => p.id == prevCallee)) { calleeSel.value = prevCallee; } else if (phones.length > 1) { calleeSel.selectedIndex = 1; } } // Отрисовка интерфейса панели function renderUI() { document.getElementById('stat-towers').textContent = towers.length; document.getElementById('stat-phones').textContent = phones.length; document.getElementById('stat-calls').textContent = activeCalls.length;

const list = document.getElementById('phones-list'); list.innerHTML = ''; phones.forEach(p => { const barsCount = Math.ceil((p.signalStrength / 100) * 4); let barsHtml = ''; for (let i = 1; i <= 4; i++) { barsHtml += `<div class="bar ${i <= barsCount ? 'active' : ''}" style="height: ${i * 3 + 2}px"></div>`; } const statusText = p.inCallWith ? `<span style="color: var(--success)">📞 В разговоре</span>` : (p.connectedTower ? `📶 ${p.connectedTower.name} (${p.signalStrength}%)` : `<span style="color: var(--danger)">❌ Нет сети</span>`); const card = document.createElement('div'); card.className = 'phone-card'; card.innerHTML = ` <div class="phone-header"> <div class="phone-title">📱 ${p.number}</div>

<div class="signal-bars" title="Сигнал: ${p.signalStrength}%">${barsHtml}</div> </div> <div class="phone-details"> <div>${statusText}</div> <div style="text-align: right;"> Баланс: <b>${p.balance.toFixed(1)} ₽</b> <button onclick="topUpBalance(${p.id})" style="display:inline-flex; padding: 2px 6px; font-size: 0.7rem; margin-left: 4px;">+50₽</button> </div> </div> `; list.appendChild(card); }); } // Отрисовка карты на Canvas function draw() { ctx.clearRect(0, 0, canvas.width, canvas.height); // Сетка координат ctx.strokeStyle = 'rgba(56, 189, 248, 0.06)';

ctx.lineWidth = 1; const gridSize = 40; for (let x = 0; x < canvas.width; x += gridSize) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke(); } for (let y = 0; y < canvas.height; y += gridSize) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke(); } // 1. Зоны покрытия вышек towers.forEach(tower => { const grad = ctx.createRadialGradient(tower.x, tower.y, 10, tower.x, tower.y, tower.radius); grad.addColorStop(0, 'rgba(56, 189, 248, 0.22)'); grad.addColorStop(0.7, 'rgba(56, 189, 248, 0.08)'); grad.addColorStop(1, 'rgba(56, 189, 248, 0.01)'); ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(tower.x, tower.y, tower.radius, 0, Math.PI * 2); ctx.fill();

ctx.strokeStyle = 'rgba(56, 189, 248, 0.35)'; ctx.setLineDash([5, 5]); ctx.beginPath(); ctx.arc(tower.x, tower.y, tower.radius, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]); // Анимация радиоволны const waveR = (pulsePhase % 1) * tower.radius; ctx.strokeStyle = `rgba(56, 189, 248, ${0.3 * (1 - pulsePhase % 1)})`; ctx.beginPath(); ctx.arc(tower.x, tower.y, waveR, 0, Math.PI * 2); ctx.stroke(); }); // 2. Магистральные каналы между вышками (Backhaul) if (towers.length > 1) { ctx.strokeStyle = 'rgba(148, 163, 184, 0.2)'; ctx.lineWidth = 1.5;

for (let i = 0; i < towers.length - 1; i++) { ctx.beginPath(); ctx.moveTo(towers[i].x, towers[i].y); ctx.lineTo(towers[i + 1].x, towers[i + 1].y); ctx.stroke(); } } // 3. Радиоканалы "Абонент <-> Вышка" phones.forEach(phone => { if (phone.connectedTower) { ctx.strokeStyle = phone.inCallWith ? '#22c55e' : 'rgba(56, 189, 248, 0.5)'; ctx.lineWidth = phone.inCallWith ? 2.5 : 1.2; ctx.beginPath(); ctx.moveTo(phone.x, phone.y); ctx.lineTo(phone.connectedTower.x, phone.connectedTower.y); ctx.stroke(); } });

// 4. Активные голосовые маршруты (подсветка трафика) activeCalls.forEach(call => { const t1 = call.caller.connectedTower; const t2 = call.callee.connectedTower; if (t1 && t2 && t1 !== t2) { ctx.strokeStyle = '#22c55e'; ctx.lineWidth = 3; ctx.setLineDash([8, 6]); ctx.lineDashOffset = -pulsePhase * 40; ctx.beginPath(); ctx.moveTo(t1.x, t1.y); ctx.lineTo(t2.x, t2.y); ctx.stroke(); ctx.setLineDash([]); } }); // 5. Иконки базовых станций towers.forEach(tower => { ctx.fillStyle = '#0f172a';

ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(tower.x, tower.y, 18, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); ctx.fillStyle = '#f8fafc'; ctx.font = '16px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('🗼', tower.x, tower.y); ctx.fillStyle = '#38bdf8'; ctx.font = 'bold 11px sans-serif'; ctx.fillText(`${tower.name} (${tower.tech})`, tower.x, tower.y + 28); }); // 6. Иконки абонентов phones.forEach(phone => {

ctx.fillStyle = phone.inCallWith ? '#14532d' : (phone.connectedTower ? '#1e293b' : '#450a0a'); ctx.strokeStyle = phone.inCallWith ? '#22c55e' : (phone.connectedTower ? '#f8fafc' : '#ef4444'); ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(phone.x, phone.y, 15, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); ctx.font = '14px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('📱', phone.x, phone.y); ctx.fillStyle = '#f8fafc'; ctx.font = '11px sans-serif'; ctx.fillText(phone.number.slice(-5), phone.x, phone.y + 24); }); } // Цикл анимации

function animate() { pulsePhase += 0.008; draw(); requestAnimationFrame(animate); } // Обработка нажатий мыши и касаний (Touch) function getPointerPos(e) { const rect = canvas.getBoundingClientRect(); const clientX = e.touches ? e.touches[0].clientX : e.clientX; const clientY = e.touches ? e.touches[0].clientY : e.clientY; return { x: clientX - rect.left, y: clientY - rect.top }; } function handleStart(e) { const pos = getPointerPos(e);

if (currentMode === 'tower') { const radius = parseInt(document.getElementById('tower-radius').value); const id = towers.length + 1; const tech = radius > 200 ? '4G LTE' : '5G NR'; towers.push(new CellTower(id, pos.x, pos.y, radius, tech)); logEvent(`Установлена новая базовая станция BTS-${id} (R=${radius}м)`, 'success'); updateNetworkState(); setMode('move'); return; } if (currentMode === 'phone') { const id = phones.length + 1; const randNum = `+7 (999) ${Math.floor(100 + Math.random() * 900)}-${Math.floor(10 + Math.random() * 89)}-${Math.floor(10 + Math.random() * 89)}`; phones.push(new MobileSubscriber(id, randNum, pos.x, pos.y, 100)); logEvent(`Выдана новая SIM-карта: ${randNum}`, 'success'); updateNetworkState(); updateSelectors(); setMode('move'); return;

} // Поиск объекта для перетаскивания for (let p of phones) { if (getDistance(pos, p) < 22) { draggedEntity = p; dragOffset = { x: pos.x - p.x, y: pos.y - p.y }; canvas.style.cursor = 'grabbing'; return; } } for (let t of towers) { if (getDistance(pos, t) < 24) { draggedEntity = t; dragOffset = { x: pos.x - t.x, y: pos.y - t.y }; canvas.style.cursor = 'grabbing'; return; } }

} function handleMove(e) { if (!draggedEntity) return; e.preventDefault(); const pos = getPointerPos(e); draggedEntity.x = Math.max(20, Math.min(canvas.width - 20, pos.x - dragOffset.x)); draggedEntity.y = Math.max(20, Math.min(canvas.height - 20, pos.y - dragOffset.y)); updateNetworkState(); } function handleEnd() { if (draggedEntity) { draggedEntity = null; canvas.style.cursor = currentMode === 'move' ? 'grab' : 'crosshair'; updateSelectors(); } } canvas.addEventListener('mousedown', handleStart);

canvas.addEventListener('mousemove', handleMove); window.addEventListener('mouseup', handleEnd); canvas.addEventListener('touchstart', handleStart, { passive: false }); canvas.addEventListener('touchmove', handleMove, { passive: false }); window.addEventListener('touchend', handleEnd); window.onload = function () { resizeCanvas(); initSimulation(); animate(); }; </script> </body> </html>
